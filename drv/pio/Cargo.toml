[package]
name = "drv-pio"
version = "0.1.0"
edition = "2024"

[dependencies]
counters = { path = "../../lib/counters" }
idol-runtime = { workspace = true }
num-traits = { workspace = true }
zerocopy = { workspace = true }
zerocopy-derive = { workspace = true }

drv-pio-api = { path = "../pio-api" }
rp2040-hal = { path = "../../lib/rp2040-hal" }
userlib = { path = "../../sys/userlib", features = ["panic-messages"] }

[build-dependencies]
idol = { workspace = true }

[[bin]]
name = "drv-pio"
test = false
doctest = false
bench = false

[lints]
workspace = true
